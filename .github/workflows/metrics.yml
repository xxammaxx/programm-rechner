name: LIVE PRODUCT METRICS

# Aktualisiert taeglich den einen kanonischen Kommentar im Issue "LIVE PRODUCT METRICS".
# Der Kommentar wird ueber den Marker <!-- live-product-metrics --> wiedergefunden und
# aktualisiert, nicht neu angelegt.
#
# Erforderliches Geheimnis: GOATCOUNTER_API_KEY (Repository-Secret).
# Fehlt es, wird ehrlich METRICS_STATUS=ANALYTICS_UNCONFIGURED gemeldet und keine Zahl
# erfunden. GITHUB_TOKEN kommt aus dem Lauf selbst und hat hier nur contents:read und
# issues:write. Kein Geheimnis liegt jemals im Auslieferungscode.
#
# Hinweis: GitHub kann geplante Workflows in oeffentlichen, inaktiven Repositories nach
# 60 Tagen abschalten. Der Frischeprüfung (METRICS_STALE) erkennt genau das.

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-product-metrics
  cancel-in-progress: false

jobs:
  messen:
    name: Messwerte abrufen und Kommentar aktualisieren
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout v5

      - name: Messwerte abrufen
        id: werte
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: node tools/metriken.mjs

      - name: Kommentar aktualisieren
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # actions/github-script v8
        env:
          BERICHT: ${{ steps.werte.outputs.bericht }}
        with:
          script: |
            const MARKER = '<!-- live-product-metrics -->';
            const TITEL = 'LIVE PRODUCT METRICS';
            const bericht = process.env.BERICHT || '';
            const inhalt = `${MARKER}\n${bericht}`;

            const suche = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${TITEL}"`,
            });
            let issue = suche.data.items.find((i) => i.title === TITEL);

            if (!issue) {
              const angelegt = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITEL,
                body: [
                  'Dieses Issue wird automatisch vom Workflow **LIVE PRODUCT METRICS** gepflegt.',
                  '',
                  'Es enthaelt **einen** Kommentar, der taeglich aktualisiert wird. Der Kommentar traegt den Marker `<!-- live-product-metrics -->`.',
                  '',
                  'Enthalten sind ausschliesslich aggregierte Nutzungszahlen. Keine personenbezogenen Daten, keine Haushaltsergebnisse, keine politischen Merkmale.',
                  '',
                  'Hinweis: GitHub kann geplante Workflows in oeffentlichen, inaktiven Repositories nach 60 Tagen abschalten. Ist der Zeitstempel im Kommentar zu alt, gilt `METRICS_STALE`.',
                ].join('\n'),
                labels: [],
              });
              issue = angelegt.data;
            }

            // Alle Seiten durchsehen, damit der Marker auch dann gefunden wird, wenn
            // spaeter weitere Kommentare hinzukommen. Sonst entstuende ein zweiter
            // Marker-Kommentar, obwohl genau einer vorgesehen ist.
            const kommentare = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              },
            );
            const vorhanden = kommentare.find((k) => k.body && k.body.includes(MARKER));

            if (vorhanden) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: vorhanden.id,
                body: inhalt,
              });
              core.info(`Kommentar ${vorhanden.id} aktualisiert.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: inhalt,
              });
              core.info('Kommentar neu angelegt.');
            }
